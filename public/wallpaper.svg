<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Original makOS wallpaper: flat, layered "Sunny Fields" illustration. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fd6"/>
      <stop offset=".55" stop-color="#6fa8f0"/>
      <stop offset="1" stop-color="#cfe6ff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset=".35" stop-color="#ffe27a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffe27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd98a"/>
      <stop offset="1" stop-color="#6fbf68"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc35b"/>
      <stop offset="1" stop-color="#3f9a45"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fae4a"/>
      <stop offset="1" stop-color="#2a7a35"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1270" cy="170" r="230" fill="url(#sun)"/>
  <circle cx="1270" cy="170" r="62" fill="#fff3b0"/>

  <g fill="#fff" opacity=".9">
    <g transform="translate(220 150)">
      <ellipse cx="0" cy="20" rx="110" ry="26"/>
      <ellipse cx="-40" cy="4" rx="48" ry="32"/>
      <ellipse cx="30" cy="-6" rx="58" ry="40"/>
    </g>
    <g transform="translate(760 95) scale(.7)">
      <ellipse cx="0" cy="20" rx="110" ry="26"/>
      <ellipse cx="-40" cy="4" rx="48" ry="32"/>
      <ellipse cx="30" cy="-6" rx="58" ry="40"/>
    </g>
    <g transform="translate(980 300) scale(.55)" opacity=".8">
      <ellipse cx="0" cy="20" rx="110" ry="26"/>
      <ellipse cx="-40" cy="4" rx="48" ry="32"/>
      <ellipse cx="30" cy="-6" rx="58" ry="40"/>
    </g>
  </g>

  <path d="M0 560 C 260 470 470 500 700 545 S 1150 470 1600 520 V900 H0 Z" fill="url(#hillBack)"/>
  <path d="M0 650 C 300 560 520 610 820 660 S 1350 600 1600 640 V900 H0 Z" fill="url(#hillMid)"/>
  <path d="M0 760 C 380 690 700 730 1000 780 S 1450 760 1600 740 V900 H0 Z" fill="url(#hillFront)"/>

  <!-- a winding path and a few dots of wildflowers -->
  <path d="M1080 900 C 1060 820 980 780 900 735 S 820 680 860 640" fill="none" stroke="#e9d9a6" stroke-width="22" stroke-linecap="round" opacity=".7"/>
  <g fill="#fff" opacity=".8">
    <circle cx="240" cy="805" r="4"/><circle cx="270" cy="822" r="3"/><circle cx="310" cy="800" r="4"/>
    <circle cx="560" cy="840" r="4"/><circle cx="600" cy="860" r="3"/><circle cx="1380" cy="830" r="4"/>
  </g>
  <g fill="#ffd34d">
    <circle cx="255" cy="815" r="3"/><circle cx="585" cy="850" r="3"/><circle cx="1400" cy="845" r="3"/><circle cx="1420" cy="820" r="3"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
