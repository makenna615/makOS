<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>makOS · Makenna Peters, Full-Stack Software Engineer</title>
    <meta
      name="description"
      content="Makenna Peters is a full-stack software engineer (Ruby on Rails, React, TypeScript, PostgreSQL) with 4+ years building EdTech SaaS. Explore her portfolio as a retro desktop."
    />
    <meta name="author" content="Makenna Peters" />
    <meta name="theme-color" content="#2f6fd6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="makOS · Makenna Peters, Full-Stack Software Engineer" />
    <meta
      property="og:description"
      content="Rails + React engineer with 4+ years in K-12 EdTech. A portfolio you can click around like a desktop."
    />
    <!-- TODO after the first Vercel deploy: make these absolute (https://<your-domain>/og-image.jpg); LinkedIn ignores relative URLs. -->
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The makOS desktop with Makenna Peters' About Me window open" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="alternate" type="text/plain" href="/resume.txt" title="Plain-text resume" />

    <!-- Start downloading the wallpaper right away (it loads during the boot screen). Media queries match the CSS layouts. -->
    <link rel="preload" as="image" href="/wallpaper.jpg" media="(min-width: 701px) and (min-height: 501px)" />
    <link
      rel="preload"
      as="image"
      imagesrcset="/wallpaper-mobile.jpg 1x, /wallpaper.jpg 2x"
      media="(max-width: 700px), (max-height: 500px)"
    />
  </head>
  <body>
    <noscript>
      makOS needs JavaScript. You can still read
      <a href="/resume.txt">Makenna Peters' plain-text resume</a>.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
